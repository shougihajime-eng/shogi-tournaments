<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243B53"/>
      <stop offset="1" stop-color="#102A43"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#cfe0ef" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#cfe0ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="koma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF0"/>
      <stop offset="0.82" stop-color="#F2E2B6"/>
      <stop offset="1" stop-color="#FAF1DA"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C99A3A"/>
      <stop offset="0.5" stop-color="#E0B354"/>
      <stop offset="1" stop-color="#C99A3A"/>
    </linearGradient>
  </defs>

  <!-- 背景（藍色） -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- 金の優勝の輝き -->
  <g opacity="0.55" fill="#E0B354">
    <path d="M398 92 l12 44 44 12 -44 12 -12 44 -12-44 -44-12 44-12 z"/>
  </g>

  <!-- 五角形の駒 -->
  <path d="M256 92 L356 138 L398 432 L114 432 L156 138 Z"
        fill="url(#koma)" stroke="#A07825" stroke-width="6" stroke-linejoin="round"/>

  <!-- 金の下線（優勝の台座） -->
  <rect x="150" y="404" width="212" height="9" rx="4.5" fill="url(#gold)"/>

  <!-- 「杯」の文字（優勝杯の意） -->
  <text x="256" y="322" text-anchor="middle"
        font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif"
        font-weight="700" font-size="210" fill="#C8421B">杯</text>
</svg>
